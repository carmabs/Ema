plugins {
    alias(libs.plugins.android.application)
}
android {
    compileSdk = rootProject.emanateVersioning.compileSdk

    defaultConfig {
        applicationId = "com.carmabs.emanate"
        minSdk = rootProject.emanateVersioning.minSdk
        targetSdk = rootProject.emanateVersioning.targetSdk
        versionCode = rootProject.emanateVersioning.versionCode
        versionName = rootProject.emanateVersioning.versionName
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
