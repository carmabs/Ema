    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emaVersioning.kotlinJvmTarget)
        }
    }

    namespace = 'com.carmabs.ema.sample.injection'

}

dependencies {
    implementation project(path: ':data')
    implementation project(path: ':presentation')
    implementation project(path: ':common')
    implementation project(path: ':domain')

    implementation project(rootProject.emaLibraries.emaAndroid)
    implementation libs.koin.android
