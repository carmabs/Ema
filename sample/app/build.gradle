plugins {
    alias(libs.plugins.android.application)
}
android {
    compileSdk = rootProject.emaVersioning.compileSdk

    defaultConfig {
        applicationId = "com.carmabs.ema"
        minSdk = rootProject.emaVersioning.minSdk
        targetSdk = rootProject.emaVersioning.targetSdk
        versionCode = rootProject.emaVersioning.versionCode
        versionName = rootProject.emaVersioning.versionName
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
