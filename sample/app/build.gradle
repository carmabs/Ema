    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        }
    }

    namespace = 'com.carmabs.emanate.sample.injection'

}

dependencies {
    implementation project(path: ':data')
    implementation project(path: ':presentation')
    implementation project(path: ':ui')
    implementation project(path: ':android-utils')
    implementation project(path: ':domain')

    implementation project(rootProject.emanateLibraries.emanateAndroid)
