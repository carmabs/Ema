plugins {
    alias(libs.plugins.android.library)
}

android {
    compileSdk = rootProject.emaVersioning.compileSdk

    defaultConfig {
        minSdk = rootProject.emaVersioning.minSdk
        targetSdk = rootProject.emaVersioning.targetSdk

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    def javaVersion = rootProject.emaVersioning.javaVersion

    compileOptions {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emaVersioning.kotlinJvmTarget)
        }
    }

    namespace = 'com.carmabs.ema.sample.data'

}

dependencies {
    implementation project(path: ':domain')
    implementation project(path: ':common')

    //Kotlin
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android
}
