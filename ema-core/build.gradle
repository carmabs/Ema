apply from: '../build-system/dependencies.gradle'

buildscript {
    apply from: '../build-system/dependencies.gradle'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-serialization:${emaVersioning.kotlinVersion}"
    }
}

apply plugin: 'kotlin'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'maven-publish'

java {
    sourceCompatibility = emaVersioning.javaVersion
    targetCompatibility = emaVersioning.javaVersion
}

kotlin {
    compilerOptions {
        jvmTarget = emaVersioning.kotlinJvmTarget
        freeCompilerArgs.add("-Xcontext-receivers")
    }
}


dependencies {
    api emaCoreDependencies.kotlin
    api emaCoreDependencies.coroutines
    api emaCoreDependencies.serializationJson
    implementation emaCoreDependencies.reflect
    implementation emaTestingDependencies.junit
}


afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components["java"]
                groupId = emaVersioning.groupId
                artifactId = emaVersioning.artifactCoreId
                version = emaVersioning.versionName
            }
        }
    }
}
