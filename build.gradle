// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.kover)
}

apply from: 'build-system/config.gradle'

// Coverage report of the published modules: ./gradlew koverHtmlReport (build/reports/kover/html)
dependencies {
    kover project(':ema-core')
    kover project(':ema-android')
    kover project(':ema-android-view')
    kover project(':ema-android-compose')
}

kover {
    reports {
        filters {
            excludes {
                // Generated code
                classes('*.databinding.*', '*.BuildConfig')
            }
        }
    }
}
