// Library-wide configuration. Dependency and plugin versions live in gradle/libs.versions.toml
rootProject.ext {

    emaVersioning = [
            minSdk                 : 24,
            compileSdk             : 37,
            targetSdk              : 37,
            versionCode            : 18,
            versionName            : "7.0.0-SNAPSHOT",
            groupId                : 'com.github.carmabs',
            artifactCoreId         : 'ema-core',
            artifactAndroidId      : 'ema-android',
            artifactComposeId      : 'ema-compose',
            artifactAndroidViewId  : 'ema-android-view',
            javaVersion            : JavaVersion.VERSION_21,
            kotlinJvmTarget        : "21",
            testRunner             : "androidx.test.runner.AndroidJUnitRunner",
            resourceExclusions     : ['META-INF/kotlinx-io.kotlin_module', 'META-INF/ema-android_debug.kotlin_module'],
            namespaceAndroid       : 'com.carmabs.ema.android',
            namespaceCompose       : 'com.carmabs.ema.compose',
            namespaceAndroidView   : 'com.carmabs.ema.android.view'
    ]
}
