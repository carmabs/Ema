plugins {
    alias(libs.plugins.kotlin.jvm)
    id 'maven-publish'
    alias(libs.plugins.kover)
}

group = rootProject.emanateVersioning.groupId
version = rootProject.emanateVersioning.versionName

java {
    sourceCompatibility = rootProject.emanateVersioning.javaVersion
    targetCompatibility = rootProject.emanateVersioning.javaVersion
    withSourcesJar()
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        optIn.add("com.carmabs.emanate.core.EmaInternalApi")
    }
}

// emanate-test uses the internal API of emanate-core, to record the sources and to replace the configuration of Ema in
// tests, so it is a friend module of it
tasks.named('compileKotlin') {
    friendPaths.from(configurations.compileClasspath.filter { it.path.contains('emanate-core') })
}

dependencies {
    api project(':emanate-core')
    constraints {
        // The internal API used can change between versions, so it must be the version emanate-test was built with
        api("${rootProject.emanateVersioning.groupId}:${rootProject.emanateVersioning.artifactCoreId}") {
            version {
                strictly(rootProject.emanateVersioning.versionName)
            }
        }
    }
    api libs.kotlinx.coroutines.test
    testImplementation libs.kotlin.test
}

publishing {
    publications {
        release(MavenPublication) {
            from components.java
            groupId = rootProject.emanateVersioning.groupId
            artifactId = rootProject.emanateVersioning.artifactTestId
            version = rootProject.emanateVersioning.versionName
        }
    }
}
