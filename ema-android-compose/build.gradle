apply from: '../build-system/dependencies.gradle'

buildscript {
    apply from: '../build-system/dependencies.gradle'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${emaVersioning.agpVersion}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${emaVersioning.kotlinVersion}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: '../build-system/compose.gradle'
apply plugin: 'maven-publish'

android {

    defaultConfig {
        compileSdkVersion emaVersioning.compileSdk
        minSdkVersion emaVersioning.minSdk
        targetSdkVersion emaVersioning.targetSdk

        testInstrumentationRunner emaVersioning.testRunner

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = emaVersioning.javaVersion
        targetCompatibility = emaVersioning.javaVersion
    }

    kotlin {
        compilerOptions {
            jvmTarget = emaVersioning.kotlinJvmTarget
        }
    }

    packagingOptions {
        resources {
            pickFirsts += emaVersioning.resourceExclusions
        }
    }


    with(composeConfig)

    publishing {
        singleVariant("release")
    }

    namespace emaVersioning.namespaceCompose
}

dependencies {
    implementation project(path: ':ema-android')
    implementation emaAndroidDependencies.reflection

    api platform(emaComposeDependencies.bom)
    api emaComposeDependencies.ui
    api emaComposeDependencies.ripple
    api emaComposeDependencies.tooling
    api emaComposeDependencies.toolingPreview
    api emaComposeDependencies.activity
    api emaComposeDependencies.koin
    api emaComposeDependencies.lifecycle
    api emaComposeDependencies.viewmodel
    api emaComposeDependencies.navigation

}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = emaVersioning.groupId
                artifactId = emaVersioning.artifactComposeId
                version = emaVersioning.versionName
            }
        }
    }
}
