site_name: Ema
site_description: A small library for MVI-style screens with Jetpack Compose, Kotlin Multiplatform ViewModels and Android Views
repo_url: https://github.com/carmabs/Ema
repo_name: carmabs/Ema

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - State: concepts/state.md
      - Actions: concepts/actions.md
      - Events: concepts/events.md
      - ViewModel: concepts/viewmodel.md
  - Guides:
      - Configuration: guides/configuration.md
      - Initializers: guides/initializers.md
      - Results between screens: guides/results-between-screens.md
      - Async work and errors: guides/async-and-errors.md
      - Dependency injection: guides/dependency-injection.md
      - Permissions: guides/permissions.md
      - Testing: guides/testing.md
      - Kotlin Multiplatform: guides/multiplatform.md
      - Utilities: guides/utilities.md
  - Compose:
      - Screens: compose/screens.md
      - Navigation: compose/navigation.md
      - Back handling: compose/back-handling.md
      - Dialogs: compose/dialogs.md
      - Saving state: compose/save-state.md
      - Permissions: compose/permissions.md
      - Utilities: compose/utilities.md
  - Android Views:
      - Overview: android-view/index.md
      - Fragments and Activities: android-view/screens.md
      - Navigation and back handling: android-view/navigation.md
      - Dialogs: android-view/dialogs.md
      - Lists: android-view/lists.md
      - Permissions: android-view/permissions.md
      - Utilities: android-view/utilities.md
  - Recommendations: recommendations.md
  - Contributing: contributing.md
